<svg xmlns="http://www.w3.org/2000/svg" width="1188" height="918" viewBox="0 0 1188 918"><rect width="1188" height="918" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="58" y="67" width="7" height="7" fill="#dd533d"/><text x="80" y="76" font-size="13" font-weight="500" fill="#5f665f"><tspan x="80" dy="0">DAVID NKEMERE / GTM STRATEGY</tspan></text><text x="58" y="151" font-size="39" font-weight="500" fill="#171919"><tspan x="58" dy="0">Outbound is a closed loop</tspan></text><text x="58" y="200" font-size="19" font-weight="400" fill="#5f665f"><tspan x="58" dy="0">Demand → focused pursuit → a decision → the next best action.</tspan></text><path d="M58 239H1130" stroke="#d9dbd6"/><rect x="58" y="293" width="312" height="220" fill="#f6f7f3" stroke="#d9dbd6"/><text x="82" y="325" font-size="13" font-weight="500" fill="#dd533d"><tspan x="82" dy="0">01</tspan></text><text x="82" y="365" font-size="25" font-weight="500" fill="#171919"><tspan x="82" dy="0">Create demand</tspan></text><text x="82" y="405" font-size="17" font-weight="400" fill="#5f665f"><tspan x="82" dy="0">Marketing-generated interest</tspan><tspan x="82" dy="25">and seller-created relevance.</tspan></text><text x="82" y="491" font-size="12" font-weight="500" fill="#5f665f"><tspan x="82" dy="0">INPUT / SHARED COMMERCIAL SIGNAL</tspan></text><rect x="408" y="293" width="312" height="220" fill="#f6f7f3" stroke="#d9dbd6"/><text x="432" y="325" font-size="13" font-weight="500" fill="#dd533d"><tspan x="432" dy="0">02</tspan></text><text x="432" y="365" font-size="25" font-weight="500" fill="#171919"><tspan x="432" dy="0">Focus the pursuit</tspan></text><text x="432" y="405" font-size="17" font-weight="400" fill="#5f665f"><tspan x="432" dy="0">Prioritize the account.</tspan><tspan x="432" dy="25">Run a focused seller play.</tspan></text><text x="432" y="491" font-size="12" font-weight="500" fill="#5f665f"><tspan x="432" dy="0">TEST / FIVE TOUCHES, SIX DAYS</tspan></text><rect x="758" y="293" width="372" height="220" fill="#f6f7f3" stroke="#d9dbd6"/><text x="782" y="325" font-size="13" font-weight="500" fill="#dd533d"><tspan x="782" dy="0">03</tspan></text><text x="782" y="365" font-size="25" font-weight="500" fill="#171919"><tspan x="782" dy="0">Make a decision</tspan></text><text x="782" y="405" font-size="17" font-weight="400" fill="#5f665f"><tspan x="782" dy="0">Qualify. Change the contact.</tspan><tspan x="782" dy="25">Or return to active nurture.</tspan></text><text x="782" y="491" font-size="12" font-weight="500" fill="#5f665f"><tspan x="782" dy="0">DISPOSITION / KEEP THE ACCOUNT</tspan></text><path d="M374 402H402M724 402H752" stroke="#dd533d" stroke-width="2"/><path d="m394 395 8 7-8 7m350-14 8 7-8 7" fill="none" stroke="#dd533d" stroke-width="2"/><text x="58" y="589" font-size="27" font-weight="500" fill="#171919"><tspan x="58" dy="0">Three paths out. No lost account.</tspan></text><rect x="58" y="626" width="337" height="163" fill="#f6f7f3" stroke="#d9dbd6"/><text x="82" y="658" font-size="13" font-weight="500" fill="#dd533d"><tspan x="82" dy="0">A</tspan></text><text x="82" y="698" font-size="25" font-weight="500" fill="#171919"><tspan x="82" dy="0">Advance</tspan></text><text x="82" y="738" font-size="17" font-weight="400" fill="#5f665f"><tspan x="82" dy="0">Qualified meeting → opportunity.</tspan></text><text x="82" y="767" font-size="12" font-weight="500" fill="#5f665f"><tspan x="82" dy="0">PROGRESS / A COMMERCIAL OUTCOME</tspan></text><rect x="426" y="626" width="336" height="163" fill="#f6f7f3" stroke="#d9dbd6"/><text x="450" y="658" font-size="13" font-weight="500" fill="#dd533d"><tspan x="450" dy="0">B</tspan></text><text x="450" y="698" font-size="25" font-weight="500" fill="#171919"><tspan x="450" dy="0">Work the committee</tspan></text><text x="450" y="738" font-size="17" font-weight="400" fill="#5f665f"><tspan x="450" dy="0">Reach the next relevant contact.</tspan></text><text x="450" y="767" font-size="12" font-weight="500" fill="#5f665f"><tspan x="450" dy="0">COVERAGE / THE ACCOUNT STAYS ACTIVE</tspan></text><rect x="793" y="626" width="337" height="163" fill="#f6f7f3" stroke="#d9dbd6"/><text x="817" y="658" font-size="13" font-weight="500" fill="#dd533d"><tspan x="817" dy="0">C</tspan></text><text x="817" y="698" font-size="25" font-weight="500" fill="#171919"><tspan x="817" dy="0">Nurture &amp; re-enter</tspan></text><text x="817" y="738" font-size="17" font-weight="400" fill="#5f665f"><tspan x="817" dy="0">Wait for a new qualifying signal.</tspan></text><text x="817" y="767" font-size="12" font-weight="500" fill="#5f665f"><tspan x="817" dy="0">RE-ENTRY / MARKETING &amp; SALES</tspan></text><path d="M58 840H1130" stroke="#d9dbd6"/><text x="58" y="876" font-size="12" font-weight="500" fill="#5f665f"><tspan x="58" dy="0">PORTFOLIO EDITION / ADAPTED FROM MY 2026 EXECUTIVE WORK</tspan></text><text x="1100" y="876" font-size="15" font-weight="600" fill="#171919"><tspan x="1100" dy="0">DN</tspan></text></g></svg>